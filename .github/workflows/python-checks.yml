name: Python checks

on:
  push:
    branches: [main]
    paths:
      - "JarvisAI/**"
      - "voice/**"
      - "scripts/**"
      - "main.py"
      - "run.py"
      - "setup.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".editorconfig"
      - ".pre-commit-config.yaml"
      - "supabase/**"
      - ".github/workflows/python-checks.yml"
  pull_request:
    paths:
      - "JarvisAI/**"
      - "voice/**"
      - "scripts/**"
      - "main.py"
      - "run.py"
      - "setup.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".editorconfig"
      - ".pre-commit-config.yaml"
      - "supabase/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

# A newer push to the same branch makes the previous run pointless; cancel it so
# runners are not queued behind a result nobody will read.
concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Lint needs no runtime dependencies: ruff is a standalone wheel and the
      # rule set in pyproject.toml is static-analysis only. That keeps this job
      # at a few seconds so a typo is reported long before the test matrix ends.
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Lint (undefined names, broken imports, syntax-level mistakes)
        run: ruff check --output-format=github JarvisAI

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            JarvisAI/requirements.txt
            requirements-dev.txt

      # PortAudio for the audio modules; libgl1/libegl1 so PyQt6 can load and
      # the UI tests run here instead of being skipped by conftest.py.
      - name: Install audio and Qt system libraries
        run: sudo apt-get install -y libportaudio2 libgl1 libegl1

      - name: Install project and test dependencies
        working-directory: JarvisAI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r ../requirements-dev.txt

      - name: Compile Python files
        working-directory: JarvisAI
        run: python -m compileall -q .

      - name: Check runtime dependencies
        working-directory: JarvisAI
        run: JARVIS_DIAGNOSE_CI=1 python diagnose.py

      - name: Run unit tests
        working-directory: JarvisAI
        run: python -m pytest -q

      # A failing test run is only useful if the failure can be read: the raw
      # job log lives on a signed blob URL that is not always reachable. Re-run
      # through the wrapper so each failure becomes a check-run annotation
      # (readable from the PR) plus a job summary.
      - name: Publish test failures as annotations
        if: failure()
        working-directory: JarvisAI
        run: python scripts/ci_pytest_annotate.py -q --tb=short

      - name: Set up Deno for Supabase personal-memory tests
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase personal-memory function
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        run: deno check supabase/functions/jarvis-personal-memory/index.ts supabase/functions/jarvis-personal-memory/domain_test.ts

      - name: Test Supabase personal-memory validators
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        run: deno test supabase/functions/jarvis-personal-memory/domain_test.ts

  windows-ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            JarvisAI/requirements.txt

      - name: Install declared runtime dependencies
        working-directory: JarvisAI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile project on Windows
        working-directory: JarvisAI
        run: python -m compileall -q .

      - name: Test Windows launch, Hologram setup, auth, and audio paths
        working-directory: JarvisAI
        run: >-
          python -m pytest -vv
          tests/test_ui_hologram.py
          tests/test_launchers.py
          tests/test_live_api_key_config.py
          tests/test_auth_flow.py
          tests/test_owner_identity_security.py
          tests/test_audio_capture.py
          tests/test_audio_playback.py
          tests/test_live_audio_helpers.py
          tests/test_playback_interrupt.py
          tests/test_ui_import_smoke.py
          tests/test_lazy_ui_imports.py
          tests/test_screen_capture_encoding.py
          tests/test_project_health.py

      # See the Linux job: annotations are readable from the check run even when
      # the raw log is not.
      - name: Publish test failures as annotations
        if: failure()
        working-directory: JarvisAI
        run: >-
          python scripts/ci_pytest_annotate.py -q --tb=short
          tests/test_ui_hologram.py
          tests/test_launchers.py
          tests/test_live_api_key_config.py
          tests/test_auth_flow.py
          tests/test_owner_identity_security.py
          tests/test_audio_capture.py
          tests/test_audio_playback.py
          tests/test_live_audio_helpers.py
          tests/test_playback_interrupt.py
          tests/test_ui_import_smoke.py
          tests/test_lazy_ui_imports.py
          tests/test_screen_capture_encoding.py
          tests/test_project_health.py
