name: Python checks

on:
  push:
    branches: [main]
    paths:
      - "JarvisAI/**"
      - "voice/**"
      - "scripts/**"
      - "main.py"
      - "run.py"
      - "setup.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".editorconfig"
      - ".pre-commit-config.yaml"
      - "supabase/**"
      - ".github/workflows/python-checks.yml"
  pull_request:
    paths:
      - "JarvisAI/**"
      - "voice/**"
      - "scripts/**"
      - "main.py"
      - "run.py"
      - "setup.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".editorconfig"
      - ".pre-commit-config.yaml"
      - "supabase/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check --output-format=github JarvisAI

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            JarvisAI/requirements.txt
            requirements-dev.txt
      - name: Install audio and Qt system libraries
        run: sudo apt-get install -y libportaudio2 libgl1 libegl1
      - name: Install project and test dependencies
        working-directory: JarvisAI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r ../requirements-dev.txt
      - name: Compile Python files
        working-directory: JarvisAI
        run: python -m compileall -q .
      - name: Check runtime dependencies
        working-directory: JarvisAI
        run: JARVIS_DIAGNOSE_CI=1 python diagnose.py
      - name: Run unit tests
        working-directory: JarvisAI
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest -vv -s
      - name: Publish test failures as annotations
        if: failure()
        working-directory: JarvisAI
        run: python scripts/ci_pytest_annotate.py -q --tb=short
      - name: Set up Deno for Supabase personal-memory tests
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase personal-memory function
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        run: deno check supabase/functions/jarvis-personal-memory/index.ts supabase/functions/jarvis-personal-memory/domain_test.ts
      - name: Test Supabase personal-memory validators
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        run: deno test supabase/functions/jarvis-personal-memory/domain_test.ts

  windows-ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            JarvisAI/requirements.txt
      - name: Install declared runtime dependencies
        working-directory: JarvisAI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile project on Windows
        working-directory: JarvisAI
        run: python -m compileall -q .
      - name: Test Windows launch, Hologram setup, auth, and audio paths
        working-directory: JarvisAI
        shell: pwsh
        run: |
          python -m pytest -vv -s `
            tests/test_ui_hologram.py `
            tests/test_launchers.py `
            tests/test_live_api_key_config.py `
            tests/test_auth_flow.py `
            tests/test_owner_identity_security.py `
            tests/test_audio_capture.py `
            tests/test_audio_playback.py `
            tests/test_live_audio_helpers.py `
            tests/test_playback_interrupt.py `
            tests/test_ui_import_smoke.py `
            tests/test_lazy_ui_imports.py `
            tests/test_screen_capture_encoding.py `
            tests/test_project_health.py `
            tests/test_windows_setup.py 2>&1 | Tee-Object -FilePath pytest-windows.log
          exit $LASTEXITCODE
      - name: Surface the end of the test log
        if: failure()
        working-directory: JarvisAI
        shell: pwsh
        run: |
          if (Test-Path pytest-windows.log) {
            Get-Content pytest-windows.log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
          }
          exit 0
      - name: Check the installer CLI on Windows
        working-directory: JarvisAI
        shell: pwsh
        run: |
          python tools/windows_setup.py --help
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          python tools/windows_setup.py interpreters
          if ($LASTEXITCODE -ne 0) { throw "no usable Python was found by the installer" }
          python tools/windows_setup.py status
          if ($LASTEXITCODE -ne 1) { throw "status must report 1 when .venv is missing" }
          python tools/windows_setup.py verify
          if ($LASTEXITCODE -ne 1) { throw "verify must fail (exit 1) instead of claiming success without a .venv" }
          exit 0
      - name: Smoke the BAT files on Windows
        working-directory: JarvisAI
        shell: cmd
        run: |
          echo 4| Jarvis_Setup.bat
          if errorlevel 1 exit /b 1
          echo n| Run_Jarvis.bat
          if not errorlevel 1 exit /b 1
          exit /b 0
      - name: Publish test failures as annotations
        if: failure()
        working-directory: JarvisAI
        run: >-
          python scripts/ci_pytest_annotate.py -q --tb=short
          tests/test_ui_hologram.py
          tests/test_launchers.py
          tests/test_live_api_key_config.py
          tests/test_auth_flow.py
          tests/test_owner_identity_security.py
          tests/test_audio_capture.py
          tests/test_audio_playback.py
          tests/test_live_audio_helpers.py
          tests/test_playback_interrupt.py
          tests/test_ui_import_smoke.py
          tests/test_lazy_ui_imports.py
          tests/test_screen_capture_encoding.py
          tests/test_project_health.py
          tests/test_windows_setup.py
