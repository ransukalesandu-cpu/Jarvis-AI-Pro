name: Python checks

on:
  push:
    branches: [main]
    paths:
      - "JarvisAI/**"
      - ".github/workflows/python-checks.yml"
  pull_request:
    paths:
      - "JarvisAI/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: JarvisAI/requirements.txt

      - name: Install PortAudio runtime for audio-module tests
        run: sudo apt-get install -y libportaudio2 libegl1

      - name: Install project and test dependencies
        working-directory: JarvisAI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python files
        working-directory: JarvisAI
        run: python -m compileall -q .

      - name: Check runtime dependencies
        working-directory: JarvisAI
        run: JARVIS_DIAGNOSE_CI=1 python diagnose.py

      - name: Run unit tests
        working-directory: JarvisAI
        run: python -m pytest -q

      - name: Set up Deno for Supabase personal-memory tests
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase personal-memory function
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        run: deno check supabase/functions/jarvis-personal-memory/index.ts supabase/functions/jarvis-personal-memory/domain_test.ts

      - name: Test Supabase personal-memory validators
        if: ${{ hashFiles('supabase/functions/jarvis-personal-memory/domain_test.ts') != '' }}
        run: deno test supabase/functions/jarvis-personal-memory/domain_test.ts
