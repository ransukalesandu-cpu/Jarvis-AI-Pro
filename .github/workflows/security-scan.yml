name: Security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to commit SHAs (tag shown in the comment).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep
      # Report-only at first: findings are shown in the log and summary but do not fail
      # the build until the owner has triaged the initial results.
      - name: Semgrep (python + secrets rules)
        continue-on-error: true
        run: semgrep scan --config p/python --config p/secrets --metrics=off --quiet jarvis scripts supabase

  osv-scanner:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@90b209d0ea55cea1da9fc0c4e65782cc6acb6e2e # v2.2.2
    with:
      scan-args: |-
        --recursive
        ./
