name: Web UI checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - "jarvis/webui/**"
      - ".github/workflows/webui-checks.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "jarvis/webui/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run
      # Design tokens come from frontend/tokens/core.json; hologram GLSL from src/hologram/shaders/**/*.glsl (+ LYGIA).
      - name: Generated tokens and shaders are up to date
        run: |
          npm run tokens
          npm run shaders
          cd .. && git add -N frontend/src/styles/tokens.css frontend/src/styles/tokens.ts jarvis/ui/theme frontend/src/hologram/shaders/glsl.generated.ts
          git diff --exit-code --stat frontend/src/styles/tokens.css frontend/src/styles/tokens.ts jarvis/ui/theme frontend/src/hologram/shaders/glsl.generated.ts || { echo "::error::Generated files are stale. Run: cd frontend && npm run tokens && npm run shaders, then commit."; exit 1; }
      - run: npm run build
      # Every UI primitive has Storybook stories for its states; they must keep compiling.
      - run: npm run build-storybook -- -o /tmp/storybook
      # The built bundle is committed so Windows users need no Node. It must match the source.
      - name: dist/ is up to date
        working-directory: .
        run: |
          git add -N jarvis/webui/dist
          git diff --exit-code --stat jarvis/webui/dist || { echo "::error::jarvis/webui/dist is stale. Run: cd frontend && npm run build, then commit it."; exit 1; }
