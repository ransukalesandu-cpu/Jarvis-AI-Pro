name: Windows desktop smoke

on:
  pull_request:
    paths:
      - "JarvisAI/**"
      - ".github/workflows/windows-ui-smoke.yml"
  push:
    branches: [main]
    paths:
      - "JarvisAI/**"
      - ".github/workflows/windows-ui-smoke.yml"
  workflow_dispatch:

jobs:
  windows-ui-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: JarvisAI/requirements.txt

      - name: Install the same declared runtime dependencies
        working-directory: JarvisAI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile project on Windows
        working-directory: JarvisAI
        run: python -m compileall -q .

      - name: Test Windows launch, Hologram setup, auth, and audio paths
        working-directory: JarvisAI
        run: >-
          python -m pytest -q
          tests/test_ui_hologram.py
          tests/test_launchers.py
          tests/test_live_api_key_config.py
          tests/test_auth_flow.py
          tests/test_owner_identity_security.py
          tests/test_audio_capture.py
          tests/test_audio_playback.py
          tests/test_live_audio_helpers.py
          tests/test_playback_interrupt.py
