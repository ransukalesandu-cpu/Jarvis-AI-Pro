# Fast, local checks that run on `git commit` once installed with:
#
#     pre-commit install
#
# They mirror the CI gate so a broken commit is caught in seconds instead of
# after a round-trip through GitHub Actions. Hooks that rewrite files (ruff
# --fix, trailing whitespace) are safe: JARVIS's test suite covers the parts of
# the app that a formatter could break.
minimum_pre_commit_version: "3.7.0"
default_stages: [pre-commit]
# web/ is the NextChat-based UI with its own lint/format tooling (prettier, eslint).
exclude: ^web/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Markdown uses two trailing spaces as a hard line break.
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.(png|jpg|jpeg|ico|mp4|obj|so|dll|pyd|wav|mp3)$
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^jarvis/dashboard/static/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude: \.(bat|cmd)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      # Blocking: the same rule set CI enforces (see [tool.ruff.lint]).
      - id: ruff
        args: [--fix]
        files: ^jarvis/.*\.py$

  # Blocking: refuse commits that add a new credential. Known test fixtures are
  # recorded in .secrets.baseline; refresh it with
  #   detect-secrets scan --baseline .secrets.baseline
  # and mark a reviewed false positive inline with `# pragma: allowlist secret`.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (^|/)(node_modules|webui/dist)/|package-lock\.json$|yarn\.lock$|crypto-js\.min\.js$
